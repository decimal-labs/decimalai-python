version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Skip MAJOR github-actions bumps — they churn + break
      # (actions/checkout@v7 broke docs CI). Take majors deliberately + tested;
      # minor/patch (incl. security) still auto-PR.
      #
      # This block sat at column 0 — a top-level `ignore:` key, which is not in
      # Dependabot's schema. An unknown top-level key makes Dependabot reject the
      # whole file, so NO updates ran here at all: the SHA pin in
      # .github/workflows/publish.yml that says "Dependabot maintains the pin" was
      # not being maintained. Re-nested under this entry. Same bug and same fix as
      # regression-check/.github/dependabot.yml (2026-06-22).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
