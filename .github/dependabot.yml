# PAUSED 2026-08-12, ahead of the public flip.
#
# `open-pull-requests-limit: 0` is Dependabot's documented way to disable VERSION
# updates for an ecosystem. It is used here instead of deleting this file so that
# the config, and the traps recorded in it, survive the pause — restoring it is a
# one-character edit per ecosystem, back to 3.
#
# WHAT IS STILL ON: Dependabot security alerts and security updates. Those are a
# repository setting, not this file, so a real advisory still raises a PR. Only
# routine version bumps are paused.
#
# WHY: ten open version-bump PRs, every check on them red — not because anything
# was broken, but because Actions minutes are exhausted on the free plan for
# PRIVATE repos, so the runner never started (zero steps, 2-8s). Actions is free
# on public repos, so the flip revives CI. The first honest signal about whether
# these suites pass should be a run someone triggered deliberately, not ten PRs
# firing at once into a newly public repo.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0   # paused — was 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0   # paused — was 3
    ignore:
      # Skip MAJOR github-actions bumps — they churn + break
      # (actions/checkout@v7 broke docs CI). Take majors deliberately + tested;
      # minor/patch (incl. security) still auto-PR.
      #
      # `ignore` must stay nested under this update entry. At column 0 it is a
      # top-level key, which is not in Dependabot's schema, and an unknown
      # top-level key makes Dependabot reject the whole file.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
