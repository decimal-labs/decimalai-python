name: CI

# PR-only triggers for cost control. Push-to-main only kicks off publish.yml
# (separate workflow).
#
# Keep this `pull_request`, never `pull_request_target`: on a public repo
# `pull_request` runs a fork's PR WITHOUT repository secrets, which is what
# makes drive-by PRs safe to run. `pull_request_target` would hand them the
# secret context.
#
# This used to add "there is nothing to steal today — no `secrets.*` reference
# exists anywhere under .github/". That stopped being true on 2026-08-29:
# conformance-live.yml reads OPENAI_API_KEY / GEMINI_API_KEY /
# DECIMAL_CONFORMANCE_*. The rule above is what keeps that safe rather than
# belt-and-braces, so it is now load-bearing. conformance-live.yml has NO
# pull_request trigger of any kind, deliberately; a fork's PR cannot reach those
# secrets from anywhere. Before adding a secret to a workflow, check that no
# fork-triggerable event can reach the job that reads it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # tests/conformance is excluded here and owned by the `conformance` job
        # below. Not because it is slow — because `.[dev]` installs three of the
        # eleven frameworks its drivers drive, so running it in this job would
        # report eight adapters "NOT RUN" and still exit 0. A partial conformance
        # matrix is worse than none: it reads as coverage and is not.
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_langchain_compat.py \
            --ignore=tests/conformance

  conformance:
    name: Framework conformance (Tier A, hermetic)
    runs-on: ubuntu-latest
    # No provider API key, no platform backend, no network beyond localhost: the
    # drivers run stub models over a real socket and POST to a local probe server
    # that validates ingest the way the backend does. That is what lets the
    # contract gate every push and PR instead of a nightly. See
    # tests/conformance/README.md.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK (no frameworks yet)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Coverage guard — every advertised framework has a driver
        # Deliberately BEFORE the framework install. This guard imports no
        # framework (every driver imports its own lazily, inside run()), so
        # "somebody added a framework and skipped the driver" fails in seconds
        # rather than after the multi-minute install below.
        run: python -m pytest tests/conformance/test_coverage.py -q -m conformance

      - name: Install every framework the drivers drive
        # The `conformance-tests` extra is the single source for this list —
        # never retype it here. See its comment in pyproject.toml.
        run: pip install -e ".[conformance-tests]"

      - name: Run the hermetic conformance matrix
        # DECIMAL_CONFORMANCE_REQUIRE_ALL turns "a driver could not import its
        # framework" from a silent skip into a failure. Without it, a broken
        # install set produces a green job that graded nothing.
        env:
          DECIMAL_CONFORMANCE_REQUIRE_ALL: "1"
        # -m conformance is REQUIRED: the marker is deselected in addopts (it
        # mutates adapter globals, so it cannot share a process with the unit
        # suite). Without it this command selects zero tests and passes green —
        # the exact 'green job that graded nothing' this suite exists to remove.
        run: python -m pytest tests/conformance -q -rs -m conformance

  langchain-compat:
    name: LangChain Compat (${{ matrix.langchain-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.3.3 is the declared floor (pyproject.toml `langchain` extra); `latest` is the ceiling.
        # A test asserts these agree — raising the floor without touching this
        # matrix means CI stops testing the version we claim to support.
        langchain-core: ["1.3.3", "latest"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install langchain-core ${{ matrix.langchain-core }}
        run: |
          if [ "${{ matrix.langchain-core }}" = "latest" ]; then
            pip install langchain-core
          else
            pip install langchain-core==${{ matrix.langchain-core }}
          fi

      - name: Run compat tests
        run: python -m pytest tests/test_langchain_compat.py -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install 'ruff>=0.15,<0.16'

      - name: Check formatting
        # E501 (line length): handled by formatter, not relevant.
        # E402: intentional lazy imports to avoid circular import.
        # F821: intentional forward refs (already have # type: ignore).
        # F841: unused locals — out of scope for this lint pass.
        run: ruff check decimalai/ --select I,E,W,F --ignore E501,E402,F821,F841

      # Still advisory, and alone in that now — floors and audit were promoted to
      # blocking on 2026-08-18 once they had run green. This one cannot follow
      # them yet: 37 errors at default settings, 348 under the --strict the
      # sibling repos use. Requiring it today would red main on every commit, and
      # a gate that is red by default is one people learn to ignore. Promote it
      # when the count reaches zero, not before.
      - name: Types (advisory)
        continue-on-error: true
        run: |
          pip install 'mypy>=1.14,<2'
          mypy decimalai/ --ignore-missing-imports --no-error-summary || true
          echo "---"
          mypy decimalai/ --ignore-missing-imports 2>&1 | tail -1

      - name: Guard against legacy package name
        # Package was renamed to `decimalai` at v0.3.0 (install == import). Fail if the
        # legacy `decimal[-_]ai` form reappears anywhere. Pattern is bracketed, so this
        # step never matches itself. The exclusion that used to sit here covered the
        # v0.3.0 upgrade note, the one file allowed to spell the old name; that note was
        # archived and removed, so the grep now has nothing to exclude.
        run: |
          if git grep -nE 'decimal[-_]ai'; then
            echo "::error::Legacy package name reintroduced — use 'decimalai' (no separator)."
            exit 1
          fi

  floors:
    # The version floors in pyproject.toml are claims. This job is what makes them
    # true: it installs the LOWEST version of every direct dependency and runs the
    # suite against it. Added 2026-08-17 after `click>=8.0` turned out to be false —
    # a bare invocation exits 0 before click 8.2, so the start hint never fired.
    # Advisory until it has been green for a week, then promote to required.
    #
    # Matrixed over the supported interpreter ends (2026-08-18). A floor can be
    # true on one Python and false on another: langchain-core>=1.3.3 held on 3.11+
    # and did not on 3.10, because per-run scope propagation there needs
    # asyncio.create_task(..., context=), which 3.10 does not have. The 3.10 leg
    # caught that. The 3.13 leg is the mirror case — a floor that only breaks on a
    # NEWER interpreter would otherwise ship unnoticed, since every other job runs
    # latest deps rather than lowest.
    name: Floors resolve and pass (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"

      - uses: astral-sh/setup-uv@v5

      - name: Install at the lowest declared versions
        run: uv pip install --system --resolution lowest-direct ".[dev]"

      - name: Show what resolved
        run: uv pip list --system

      - name: The floors are claims — run them
        run: >-
          python -m pytest tests -q
          -m "not live_llm and not conformance and not integration"

  audit:
    # Known-advisory check against the resolved dependency set. The pyproject
    # already tracks specific CVEs in hand-written comments; this is the same job
    # done by a tool that does not forget. Clean as of 2026-08-17 ("No known
    # vulnerabilities found"), so it starts from a green baseline — but advisory,
    # because a new advisory lands on someone else's schedule and should not turn
    # main red before it has been read.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and auditor
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit .

      - name: Audit
        run: pip-audit --progress-spinner off
