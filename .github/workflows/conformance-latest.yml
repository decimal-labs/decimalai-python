# The FLOATING conformance lane: the contract vs the NEWEST frameworks.
#
# The pinned lane runs in ci.yml on every push and PR and gates. This one floats
# every framework to latest and is ADVISORY — it answers "did an upstream release
# break one of our adapters?", which is a question a version range can only guess
# at. When it goes red the pinned gate stays green and releases keep flowing; you
# fix the adapter, or record a new baseline if upstream was right.
#
# It lives here, next to the adapters it checks, on purpose. Nightly jobs that
# spend real model calls have to be guarded on provider credentials and no-op
# without them. Tier A conformance needs neither — stub models over a real
# socket, a local probe server, no provider key and no backend — so gating it
# behind those secrets would make it a no-op for a reason that does not apply
# to it. Hermetic is what makes a nightly cheap enough to be honest.
name: Conformance (latest frameworks)

on:
  schedule:
    - cron: "0 7 * * *"      # nightly 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write              # to open the advisory issue on red

concurrency:
  group: conformance-latest
  cancel-in-progress: true

jobs:
  latest:
    # One job per test environment. No single environment can hold every
    # framework: openai-agents / pydantic-ai need openai>=3, crewai / litellm pin
    # openai<3 — tests/conformance/environments.py says which driver belongs
    # where. Each leg floats ITS environment's install set and opens and closes
    # ITS OWN advisory issue, so one environment recovering never closes the
    # other's.
    name: Contract vs newest frameworks (${{ matrix.test_env }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        test_env: [openai3, openai2]
    env:
      DECIMAL_TEST_ENV: ${{ matrix.test_env }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the SDK and every framework, floated to newest
        # --upgrade is the whole point: this lane deliberately takes whatever is
        # newest today. The extras come from environments.TEST_ENVS (the one place
        # each environment is defined), and the requirements to float are read out
        # of those extras with every `decimalai[...]` self-reference expanded — a
        # bare `decimalai[all]` would otherwise float nothing but decimalai itself.
        # The floors stay ON: `--upgrade` with `>=floor` still takes the newest
        # release, and without them pip may "upgrade" one framework by quietly
        # backtracking another below its floor (google-adk caps opentelemetry, so
        # a floorless resolve can trade the newest google-adk for the newest
        # opentelemetry-instrumentation).
        run: |
          python -m pip install --upgrade pip
          EXTRAS=$(python - "$DECIMAL_TEST_ENV" <<'PY'
          import re, sys
          sys.path.insert(0, ".")
          from tests.conformance.environments import TEST_ENVS
          print(re.search(r"\.\[([^\]]+)\]", TEST_ENVS[sys.argv[1]]).group(1))
          PY
          )
          echo "environment $DECIMAL_TEST_ENV installs .[$EXTRAS]"
          pip install -e ".[$EXTRAS]"
          python - "$EXTRAS" > floated-requirements.txt <<'PY'
          import re, sys, tomllib
          opt = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]
          names, seen = set(), set()

          def walk(extra):
              if extra in seen:
                  return
              seen.add(extra)
              for req in opt[extra]:
                  m = re.match(r"\s*([A-Za-z0-9._-]+)\s*(\[[^\]]*\])?", req)
                  if m.group(1).lower() == "decimalai":
                      for sub in (m.group(2) or "").strip("[]").split(","):
                          walk(sub.strip())
                  else:
                      names.add(req)  # the whole line: its own extras, floor, marker

          for extra in sys.argv[1].split(","):
              walk(extra.strip())
          print("\n".join(sorted(names)))
          PY
          cat floated-requirements.txt
          pip install --upgrade -r floated-requirements.txt

      - name: Record what we actually resolved
        # The version diff is the first thing a human wants when this goes red.
        run: pip freeze | sort > resolved-versions.txt && cat resolved-versions.txt

      - name: Run the conformance matrix against newest
        id: matrix
        # REQUIRE_ALL because a driver that cannot import its framework must be a
        # failure here, not a skip: on a floating lane, "the new release broke the
        # import" is exactly the finding we are looking for. Per environment: the
        # drivers that belong to the other one are named, and graded by its leg.
        env:
          DECIMAL_CONFORMANCE_REQUIRE_ALL: "1"
        run: python -m pytest tests/conformance -q -rs -m conformance

      - name: Upload the resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-latest-versions-${{ matrix.test_env }}
          path: resolved-versions.txt

      - name: Open an advisory issue on red
        # Advisory, not blocking: this lane never gates a release. One open issue
        # at a time PER ENVIRONMENT — re-running nightly must not spam, and the
        # openai3 leg keeps the original `conformance-latest` label.
        if: failure()
        uses: actions/github-script@v7
        env:
          TEST_ENV: ${{ matrix.test_env }}
        with:
          script: |
            const env = process.env.TEST_ENV;
            const label = env === "openai3" ? "conformance-latest" : `conformance-latest-${env}`;
            const title = `Conformance (${env}): an upstream framework release broke a contract row`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: [label],
            });
            const body = [
              `The floating conformance lane went red in the ${env} test environment. The pinned gate is unaffected, so releases are not blocked.`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Next steps are in `tests/conformance/README.md` under *When a new framework version breaks a row*:",
              `download the \`conformance-latest-versions-${env}\` artifact to see which upstream release moved, then either`,
              "fix the adapter, or — if the new upstream behaviour is correct and ours was not — record a new baseline",
              "and raise the floor.",
              "",
              "Do not make the row green by editing a driver or by adding a line to `known_failures.txt`.",
            ].join("\n");
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            }

      - name: Close the advisory when the lane recovers
        # The counterpart to the step above, and it was missing. Without it this
        # lane can only ever ADD red to the issue tab: #11 was filed 2026-08-21,
        # the lane went green on 08-24, and on 08-28 the issue was still open,
        # still the top thing a visitor sees, describing a break that upstream
        # and a version cap had already resolved. An advisory nobody retracts
        # stops being an advisory and becomes background noise — the exact
        # outcome the "one open issue at a time" rule above was protecting.
        #
        # Deliberately closes rather than just commenting: `if: success()` means
        # the whole matrix passed on newest, which is the same evidence that
        # would have kept the issue from being filed at all.
        if: success()
        uses: actions/github-script@v7
        env:
          TEST_ENV: ${{ matrix.test_env }}
        with:
          script: |
            const env = process.env.TEST_ENV;
            const label = env === "openai3" ? "conformance-latest" : `conformance-latest-${env}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: [label],
            });
            if (open.data.length === 0) return;

            let resolved = "";
            try {
              const fs = require("fs");
              resolved = "\n\nResolved on this run:\n\n```\n"
                + fs.readFileSync("resolved-versions.txt", "utf8").trim()
                + "\n```";
            } catch { /* the artifact step is best-effort; the close is not */ }

            const body = [
              `The floating conformance lane is green again in the ${env} test environment — its full matrix passed against newest.`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Closing automatically. If the row broke again the nightly would have filed a new issue",
              "rather than leaving this one open, so an open issue here always means *currently* red.",
              "",
              "Worth checking before you treat this as fully resolved: a lane can go green because the",
              "adapter was fixed, or because a version cap stopped it floating to the release that broke",
              "it. Those are different outcomes, and only the first one is a fix. The resolved versions",
              "below say which happened.",
            ].join("\n") + resolved;

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed", state_reason: "completed",
              });
            }
