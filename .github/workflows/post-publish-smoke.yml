# Does the release a user can actually `pip install` still do what the docs say?
#
# This workflow runs. It did not while the repository was private: org billing
# had lapsed, private repos consume billable Actions minutes, and every run died
# in ~2s with steps=0 — with the reason visible only via
# `gh api /repos/{o}/{r}/check-runs/{id}/annotations`, never in the job log.
#
# An earlier version of this comment asserted that a public-repo flip would NOT
# clear it. That was wrong: public repositories get unbilled minutes, and the
# flip turned CI green here with no billing change at all. Recorded because the
# claim was argued from community threads rather than tested, and it cost time.
#
# Still true and worth keeping: a missing run is "no signal", never "green".
#
# ── why this exists ──────────────────────────────────────────────────────────
# The release gate's clean-room step (scripts/release.sh) proves exactly two
# things about the wheel: `import decimalai` works and `decimalai --help` exits
# 0. Both of those survive a quickstart that has stopped producing a single
# trace. So "the docs teach an API the wheel doesn't have", "the wheel predates
# its tag" and "the documented flow silently sends nothing" can all ship, across
# several releases, with every gate green — because nothing ties a user-facing
# claim to the artifact a user can actually get.
#
# This lane installs decimalai FROM PYPI (never the checkout — installing the
# source is what makes a smoke test itself instead of the release) and runs the
# published quickstart end to end:
#
#   docs quickstart §1  `decimalai --version` prints a version
#   docs quickstart §2  `decimalai init` — "✓ Test trace sent successfully"
#   docs quickstart §4  the "No framework" snippet: @decimalai.trace +
#                       SkillRouter.build_prompt_fragment + log_llm_call
#
# and then asserts on the WIRE, not on stdout. That distinction is the whole
# point: `decimalai init` prints its "✓ Test trace sent successfully" line from
# inside a try/except whose body only *queues* the trace, so the CLI says it
# worked whether or not anything lands. Verified locally against decimalai
# 0.10.2 from PyPI: with an ingest that refuses every trace, `decimalai init`
# still exits 0 and still prints all three checkmarks, while this smoke goes red.
#
# ── no secrets, by construction ──────────────────────────────────────────────
# A smoke gated on secrets silently no-ops, which is the same failure mode as
# having no smoke at all. Both ends of the run are local HTTP servers, exactly
# as tests/conformance already does it:
#   * ingest → tests/conformance/probe.py, whose validate_trace_payload is a
#     fingerprinted port of the backend's own trace validator, so "accepted"
#     means "production would have stored this row";
#   * the model → a stub OpenAI Chat Completions service on 127.0.0.1 that the
#     REAL openai client is pointed at with base_url=.
# No provider key, no DecimalAI backend, no `secrets.*` reference anywhere.
#
# Deliberately out of scope: the docs' keyless `decimalai skills pull <slug>`
# claim. Proving that needs the live registry, and a release smoke that fails
# when prod hiccups teaches people to ignore it.
name: Post-publish smoke (PyPI artifact vs the docs)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "PyPI version to smoke (default: whatever PyPI serves as latest)"
        required: false
        default: ""
      ref:
        description: "Checkout to take the conformance probe from (default: this ref)"
        required: false
        default: ""

# Read-only by default; the reporting job below asks for `issues: write` on its
# own. Never workflow-wide — same rule publish.yml states for id-token.
permissions:
  contents: read

concurrency:
  # Per release, and NOT cancel-in-progress: a second release should not silently
  # discard the first one's only post-publish evidence.
  group: post-publish-smoke-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Documented quickstart from PyPI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor the docs promise and the newest supported. A quickstart that
        # only works on one of them is a defect users hit on the other.
        python-version: ["3.10", "3.12"]

    steps:
      - name: Resolve which release to smoke
        id: target
        # Inputs go through env, never straight into the script body: a
        # `${{ inputs.* }}` expansion inside `run:` is string-substituted before
        # bash sees it, which is how workflow command injection starts.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
            REF="$RELEASE_TAG"
          else
            VERSION="${INPUT_VERSION#v}"
            if [ -z "$VERSION" ]; then
              VERSION="$(curl -fsSL https://pypi.org/pypi/decimalai/json \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
            fi
            REF="${INPUT_REF:-$DEFAULT_REF}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not work out which version to smoke"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Smoking decimalai $VERSION, probe from $REF"

      - uses: actions/checkout@v6
        with:
          # The tag being smoked, so the probe and the documented snippet come
          # from the revision that was released — not from whatever main is now.
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # No pip cache on purpose: this job's entire job is to exercise the
          # artifact PyPI is serving right now.

      - name: Wait for PyPI to serve the release
        # A release event fires before the file is installable everywhere. Without
        # this the smoke's first red would be a CDN race, and a flaky smoke gets
        # ignored, which is how we got here.
        #
        # 2026-08-28: it got ignored anyway, and this step is why. On v0.11.1 the
        # poll SUCCEEDED — attempt 15 on the 3.10 leg, attempt 13 on 3.12 — and the
        # very next request 404'd, in the same second on one leg:
        #
        #   11:58:07  PyPI is serving decimalai 0.11.1 (attempt 15)
        #   11:58:07  curl (22) — /pypi/decimalai/0.11.1/json returned 404
        #   11:57:47  PyPI is serving decimalai 0.11.1 (attempt 13)
        #   11:57:52  ERROR: No matching distribution found for decimalai==0.11.1
        #
        # PyPI is fronted by a CDN whose edges do not agree with each other during
        # propagation, so ONE 200 vouches for exactly one request against one edge.
        # A longer poll would not have helped; the poll was already working.
        #
        # So: require the answer to be STABLE (three consecutive 200s, spaced), and
        # probe the artifact a reader actually downloads rather than only its
        # metadata — the JSON and the files propagate independently.
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          streak=0
          for attempt in $(seq 1 60); do
            code="$(curl -s -o meta.json -w '%{http_code}' \
              "https://pypi.org/pypi/decimalai/$VERSION/json" || echo 000)"
            wheel_code=000
            if [ "$code" = "200" ]; then
              url="$(python3 -c 'import json;print(next((f["url"] for f in json.load(open("meta.json"))["urls"] if f["packagetype"]=="bdist_wheel"), ""))' 2>/dev/null || true)"
              if [ -n "$url" ]; then
                wheel_code="$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 "$url" || echo 000)"
              fi
            fi
            case "$wheel_code" in
              200|206) streak=$((streak + 1)) ;;
              *)       streak=0 ;;
            esac
            if [ "$streak" -ge 3 ]; then
              echo "PyPI is serving decimalai $VERSION consistently (3 in a row, attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: meta=$code wheel=$wheel_code streak=$streak — waiting 10s"
            sleep 10
          done
          echo "::error::PyPI never served decimalai $VERSION consistently (60 attempts, ~10 minutes)"
          exit 1

      - name: Assert the artifact backs the documented Python floor
        # The docs say "requires Python 3.10+" and warn that pip silently installs
        # an outdated release on 3.9. That promise is kept by ONE field on the
        # uploaded files, so read it off the artifact rather than provisioning a
        # dead interpreter to discover it.
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          # Retried for the reason in the wait step: a 200 there does not bind the
          # next request, and this fetch is the one that 404'd on the 3.10 leg of
          # v0.11.1 one second after the wait went green.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "https://pypi.org/pypi/decimalai/$VERSION/json" > release.json; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not fetch release metadata for $VERSION after 5 attempts"; exit 1
            fi
            echo "attempt $attempt: metadata fetch failed — waiting 15s"; sleep 15
          done
          python3 - <<'PY'
          import json
          data = json.load(open("release.json"))
          files = data["urls"]
          assert files, "the release has no files on PyPI at all"
          kinds = {f["packagetype"] for f in files}
          assert "bdist_wheel" in kinds, f"no wheel published, only {sorted(kinds)}"
          floors = {f.get("requires_python") for f in files}
          assert floors == {">=3.10"}, (
              "docs promise Python 3.10+, but the uploaded files declare "
              f"requires_python={sorted(str(f) for f in floors)}"
          )
          print(f"OK: {sorted(kinds)} published, requires_python={floors.pop()}")
          PY

      - name: Build a clean environment and install FROM PYPI
        # Outside $GITHUB_WORKSPACE, so nothing here can accidentally reach the
        # checkout. Note what is absent and must stay absent: `pip install -e .`,
        # `pip install .`, and any requirements file from the repo. `openai` is
        # installed because the documented snippet imports it — it is the
        # provider SDK a reader of that page already has.
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install --quiet --upgrade pip
          # Retried for the same CDN reason: this is the step that failed on the
          # 3.12 leg of v0.11.1 with "No matching distribution found", five seconds
          # after the wait step had confirmed PyPI was serving it.
          for attempt in 1 2 3 4 5; do
            if "$RUNNER_TEMP/smoke-venv/bin/pip" install --no-cache-dir "decimalai==$VERSION" openai; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not install decimalai==$VERSION from PyPI after 5 attempts"; exit 1
            fi
            echo "attempt $attempt: install failed — waiting 15s"; sleep 15
          done
          "$RUNNER_TEMP/smoke-venv/bin/pip" freeze | sort > "$RUNNER_TEMP/installed.txt"
          cat "$RUNNER_TEMP/installed.txt"

      - name: Run the documented quickstart against the released wheel
        # cwd is a temp dir and PYTHONPATH is unset: with the repo root on
        # either, `import decimalai` picks the checkout and every assertion below
        # becomes vacuous. The script hard-aborts if that happens anyway
        # (exit 2), so this is belt-and-braces, not the only guard.
        # `unset`, not `env: PYTHONPATH: ""` — an EMPTY PYTHONPATH is not an
        # absent one: CPython reads it as a single empty entry, i.e. cwd.
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          unset PYTHONPATH
          mkdir -p "$RUNNER_TEMP/smoke-run"
          cd "$RUNNER_TEMP/smoke-run"
          PATH="$RUNNER_TEMP/smoke-venv/bin:$PATH" \
            "$RUNNER_TEMP/smoke-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/pypi_smoke.py" \
              --expect-version "$VERSION" \
              --repo-root "$GITHUB_WORKSPACE" \
            2>&1 | tee "$RUNNER_TEMP/smoke-${{ matrix.python-version }}.log"

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-publish-smoke-${{ steps.target.outputs.version }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/smoke-${{ matrix.python-version }}.log
            ${{ runner.temp }}/installed.txt
          if-no-files-found: warn

  report:
    name: Escalate a broken release
    needs: [smoke]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue — the published release does not keep a documented claim
        # This lane runs AFTER the upload, so it can't block anything; the only
        # useful response to red is a loud, deduplicated issue and a fix release.
        uses: actions/github-script@v7
        with:
          script: |
            // `.replace(/^v/, "")` so this matches what the smoke job actually
            // smoked: `target` strips the tag's leading v, this did not, and the
            // premise probe below is a real request against that string. PyPI
            // happens to normalise `v0.11.1` to 200 today, so the difference has
            // been invisible — but relying on that would make the probe fail
            // QUIETLY into "unreachable" if it ever stopped, which is the wrong
            // direction for a check whose whole job is to not overclaim.
            const version = (
              (context.payload.release && context.payload.release.tag_name) ||
              (context.payload.inputs && context.payload.inputs.version) || "latest"
            ).replace(/^v/, "");
            // VERIFY THE PREMISE BEFORE ASSERTING IT.
            //
            // `if: failure()` fires on ANY failure of the smoke job, including one
            // where zero assertions ever ran. Until 2026-08-28 the body below was
            // unconditional, so on v0.11.1 — where both legs died fetching the
            // artifact during CDN propagation — this lane told the world, on the
            // public flagship repo, that the current release "does not do what the
            // docs say it does". It does; 26 of 26 checks pass against that wheel.
            //
            // A claim this strong has to be earned. If the artifact is reachable
            // now, the smoke's red is about the artifact and the strong wording is
            // right. If it is NOT reachable, the only honest statement is that the
            // lane could not test it. Getting this wrong in the alarming direction
            // is worse than staying quiet: it spends the credibility the lane exists
            // to build, and it is unretractable once someone has read it.
            let reachable = false;
            let probeNote = "";
            try {
              const res = await fetch(`https://pypi.org/pypi/decimalai/${version}/json`);
              reachable = res.ok;
              probeNote = `PyPI answered ${res.status} for \`${version}\` when this issue was written.`;
            } catch (err) {
              probeNote = `The premise probe itself failed (${err.message}).`;
            }

            const runLink = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const title = reachable
              ? `Post-publish smoke failed for ${version} — the released artifact breaks a documented claim`
              : `Post-publish smoke could not test ${version} — the artifact was unreachable, result inconclusive`;

            const body = (reachable ? [
              `The wheel on PyPI (\`${version}\`) does not do what the docs say it does.`,
              "It is already published and PyPI is append-only, so the fix is a follow-up release,",
              "not a re-run.",
              "",
              `Run: ${runLink}`,
              "",
              "The failing check names its own claim. Read the run log (or the",
              "`post-publish-smoke-*` artifact) and start from the first FAIL line:",
              "",
              "- a version check → the wheel and its tag disagree;",
              "- a `decimalai init` / snippet check → the documented flow itself broke;",
              "- a *REACHED the ingest wire* check → the flow still exits 0 and still prints",
              "  its checkmarks, but no trace lands. That is the defect class this lane exists for.",
              "",
              "Do not make it green by relaxing `scripts/pypi_smoke.py`.",
            ] : [
              `The smoke could not fetch \`decimalai==${version}\` from PyPI, so it never reached`,
              "an assertion. **This is not a statement about the release.** Nothing here says the",
              "artifact is broken, and no follow-up release is implied.",
              "",
              `Run: ${runLink}`,
              "",
              "Most likely cause, and the one this lane has already been bitten by: PyPI's CDN",
              "edges disagree with each other while a release propagates, so the wait step can go",
              "green and the very next request still 404. See the comment on the wait step.",
              "",
              "What to do: re-run the workflow. If it stays red with the artifact reachable, the",
              "title of this issue will change on the next run — that is the signal worth acting on.",
            ]).concat([
              "",
              `<sub>${probeNote}</sub>`,
            ]).join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: ["post-publish-smoke"],
            });
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["post-publish-smoke"],
              });
            }
