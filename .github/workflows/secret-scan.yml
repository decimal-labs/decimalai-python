name: Secret scan

# The server-side half of the secret gate. Local pre-commit and pre-push hooks catch a
# mistake at the moment it is made, but they live in .git/hooks, which is untracked and
# never cloned, so they only protect the machine that installed them. This job runs on
# GitHub, where every push is checked, and it scans the FULL history rather than the
# diff: a scan of the diff alone would go green on a force-push that rewrites a leak
# into an earlier commit.
#
# Scope note: this job checks credential SHAPES only. It is a floor, not a substitute
# for reading what you are about to publish.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: No credentials in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history — see the note above

      # Pinned to an exact version rather than an action. gitleaks-action asks
      # organisations for a licence key, and a scanner that can be disabled by a
      # billing lapse is not a control.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: |
          set -euo pipefail
          gitleaks git . \
            --no-banner \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      # Uploaded on failure only, and redacted: the report names the file and
      # commit so it can be fixed, and never prints the secret into a public log.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

      - name: What to do if this failed
        if: failure()
        run: |
          echo "::error::A credential-shaped string is present in this repo's history."
          echo "Rotate the credential FIRST — assume it is compromised the moment it"
          echo "reaches GitHub, because a pushed commit stays fetchable by SHA."
          echo "Then remove it from history, and only then re-run this job."
          echo "A confirmed false positive belongs in .gitleaks.toml with a reason."
          exit 1
