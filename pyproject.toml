[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decimalai"
version = "0.22.1"
# Keep byte-identical with the GitHub repo description and the docs landing line.
# It is the one sentence a stranger reads on PyPI, in GitHub search results and in
# the org list, and it drifted: PyPI said "manifest-aware agent change management"
# while GitHub said the lift sentence — two different products to a skimming
# reader. The lift sentence is the differentiated one; the other names a mechanism
# nobody is searching for. Reaches PyPI on the next release, not before.
description = "Python SDK for agent evals and skill routing — measure a skill's real lift before you trust it"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Decimal AI"}]
keywords = [
    "ai-agents",
    "llm",
    "agent-versioning",
    "regression-testing",
    "tracing",
    "observability",
    "evaluation",
    "skills",
    "manifest",
    "langchain",
    "openai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # >=2.3, not >=2.0: `Field name "schema_json" shadows an attribute in
    # parent "BaseModel"` and `Field "model_name" has conflict with protected
    # namespace "model_"` are hard NameErrors at class-definition time before
    # 2.3, and only became warnings in 2.3. So the old floor admitted four
    # releases (2.0, 2.0.3, 2.1, 2.2) on which `import decimalai` cannot
    # succeed at all — pip resolved happily and the first import died.
    # Bisected: 2.0 FAIL, 2.0.3 FAIL, 2.1 FAIL, 2.2 FAIL, 2.3 OK, 2.4 OK.
    "pydantic>=2.3",
    "httpx>=0.28.1",
    # `_config.py` reads a project's .env at import so DECIMAL_API_KEY can live
    # in a file rather than a shell. That was written as a best-effort optional
    # import, which meant whether the feature existed at all depended on what
    # some OTHER package happened to drag in — present on a laptop with a fat
    # venv, absent in a slim container, with no signal either way. Declare it.
    "python-dotenv>=1.0",
    # 8.2 is the floor a bare `decimalai` invocation actually needs: before it,
    # a no-args group exits 0 instead of 2, so the start hint never fires.
    # Bisected 2026-08-17 — 8.0/8.1 fail, 8.2/8.3 pass.
    "click>=8.2",
    # Floored at 1.28.0 — the lowest opentelemetry at which the OpenInference
    # instrumentor stack (the spans this SDK exists to route) actually *works*,
    # not just co-installs. Below it the floor lane installs but fails at import:
    # semconv < 0.46b0 lacks `opentelemetry.semconv.attributes` (the instrumentors'
    # BaseInstrumentor imports it), and opentelemetry-instrumentation < 0.49b0
    # imports `pkg_resources` (absent from modern/uv venvs). 1.28.0 pairs with
    # semconv 0.49b0 + instrumentation 0.49b0 — first version both are satisfied.
    # (Was >=1.20, a co-installs-but-import-breaks fiction.) Verify by installing
    # the lowest version every floor allows and importing the instrumentors.
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-api>=1.28.0",
    # Floored at 0.8.0 for `skillevaluation.skillfmt`: the on-disk skill format that
    # `decimalai.skillpkg` installs, checks and hashes (install names, SKILL.md bytes,
    # the validator, lock_hash). The registry renders with the same module, so the two
    # agree by construction. 0.8.0 also has everything older floors were for:
    # `skillevaluation.parser`, the runner CLI and `skillevaluation.safety`.
    "skillevaluation>=0.8.0",
    # SKILL.md frontmatter is YAML, and the SDK parses it. Declared here rather than
    # left to arrive through skillevaluation's own requirements.
    "PyYAML>=6.0.2",  # 6.0.2: the first release with Python 3.13 wheels (6.0 cannot build there)
    # `.decimal/skills.toml` is TOML. Python 3.11 ships tomllib; 3.10 reads it with
    # tomli, the same parser under its pre-stdlib name.
    'tomli>=2; python_version < "3.11"',
]

[project.optional-dependencies]
# Framework/provider adapters are extras, not core deps (since 2026-07-23).
# Every framework import in the package is function-local and guarded with an
# ImportError naming its extra, so a core-only install stays importable.
#
# EVERY FLOOR IS THE NEWEST RELEASE, ON PURPOSE (raised 2026-10-14). The SDK
# supports the current release of each framework and nothing older: no version
# checks, shims or fallbacks for earlier APIs. A floor here is the version the
# unit suite and the conformance matrix were RUN against. When a newer release
# passes, raise the floor to it; do not keep a window open for versions nobody runs.
#
# TWO ENVIRONMENTS, because upstream has split on openai 3. openai-agents and
# pydantic-ai-slim[openai] need openai>=3; crewai, litellm and
# llama-index-llms-openai still pin openai<3. No single environment can hold both:
#   * openai 3 — every runtime extra except `evals`, and `all`. What a user gets.
#     Graded by `conformance-tests` (+ `dev`).
#   * openai 2 — `evals`, `crewai-tests`, `llamaindex-tests`. Graded by
#     `conformance-tests-openai2`, in its own environment.
# Selecting one is DECIMAL_TEST_ENV=openai3|openai2 (tests/conformance/README.md,
# "Two environments"). Verify any change here with `uv pip compile pyproject.toml
# --extra <name>` for EVERY extra, `all` included: a floor in one extra can make
# another unsatisfiable, and only a resolve says so.
#
# Caps: none on any runtime extra. A cap guesses at breakage that has not
# happened; the floating conformance lane (conformance-latest.yml) tests it instead.
#
# langchain-core: newest release. It is also above the two floors that used to
# need saying — the CVE-2026-44843 fix (1.3.3) and the py3.10 per-run scope fix
# (1.4.8, context.run(create_task)) — so one marker-free line holds on every
# supported Python. No `<2`: langchain and langgraph both cap <2 themselves, and
# for a bare langchain-core install the cap predicted a release that does not exist.
langchain = ["langchain-core>=1.6.10"]
# The provider SDK the init(openai=True) one-liner instruments. decimalai code
# never imports `openai`; this extra exists so `pip install "decimalai[openai]"`
# co-installs it.
openai = ["openai>=3.30.0"]
openai-agents = ["openai-agents>=0.23.1"]
# Runtime extra for the native Claude Agent SDK integration
# (decimalai.init(claude_agent_sdk=True)).
claude-agent-sdk = ["claude-agent-sdk>=0.2.166"]
# Runtime extra for the Pydantic AI integration (decimalai.pydantic_ai.agent_config).
# pydantic-ai-SLIM, not the `pydantic-ai` meta package: the meta package always
# pulls slim's `logfire` extra, which needs opentelemetry-instrumentation-httpx
# >=0.65b0 and so opentelemetry-api>=1.44, while google-adk 2.12 caps
# opentelemetry-api<=1.42.1 — with it, `decimalai[all]` does not resolve. The three
# provider extras are the ones the scaffold's `pip install "decimalai[pydantic-ai]"`
# promises need no second install line (decimalai/cli/scaffold.py,
# _PYDANTIC_AI_PROVIDERS).
pydantic-ai = ["pydantic-ai-slim[openai,google,anthropic]>=2.56.0"]
# Runtime extra for Google ADK (decimalai.adk.agent_config() and DecimalAIPlugin).
adk = ["google-adk>=2.12.0"]
langgraph = ["langgraph>=1.2.15"]
# Runtime extra for the native LlamaIndex integration (decimalai.init(llamaindex=True)).
# The adapter's ImportError and [llamaindex-tests] state the same floor
# (tests/test_llamaindex_tree_fidelity.py holds them to it).
llamaindex = ["llama-index-core>=0.14.25"]
# litellm, for the client-side LLM evaluators. OPENAI 2 WORLD: litellm pins
# openai<3, so this extra cannot share an environment with `openai`,
# `openai-agents` or `pydantic-ai` — which is why it is not in `all`.
evals = ["litellm>=1.105.0"]
# Every runtime extra that co-installs, in one line: the openai 3 world. `evals`
# is left out because it cannot resolve beside `openai>=3.30.0` (see above);
# install it in a separate environment. Self-referential, so floors stay defined
# once in their own extras.
all = [
    "decimalai[langchain,openai,openai-agents,claude-agent-sdk,pydantic-ai,adk,langgraph,llamaindex]",
]
# The unit-test toolchain and nothing else, so the openai 2 environment can have
# it without `dev`'s openai 3 frameworks.
test-toolchain = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.16.0",
    "responses>=0.26.3",
]
dev = [
    "decimalai[test-toolchain]",
    # Refusal-path tests exercise the real BaseInstrumentor. 0.63b1, not the newer
    # 0.66b1: each instrumentation release pins its semantic-conventions twin, and
    # 0.64b0+ needs opentelemetry-api>=1.43, which google-adk's <=1.42.1 cap rules
    # out of the `.[dev,conformance-tests]` environment CI builds.
    "opentelemetry-instrumentation>=0.63b1",
    # Mirrors the [langchain] extra.
    "langchain-core>=1.6.10",
    # `langchain` and `langchain-openai` are not redundant with langchain-core: the
    # scaffold's generated file imports `from langchain.chat_models import
    # init_chat_model`, and without them tests/test_cli_init_scaffold_runs.py
    # SKIPS — a permanent skip that reads as a pass. Floored like every line here:
    # `--resolution lowest-direct` takes an unfloored requirement to its first-ever
    # release, and langchain 0.0.1 ships a top-level `tests/` package that shadows
    # this repo's.
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    # The ChatAnthropic case in tests/test_skill_route_split_langchain.py. It was
    # only in `live-llm-tests`, so the case ran on a developer's fuller venv and
    # in no environment CI or the gate builds (tests/test_test_environments_phase1.py
    # holds every unit test's importorskip to an environment's extras).
    "langchain-anthropic>=1.7.6",
    "openai-agents>=0.23.1",
    # For the create_react_agent introspection test.
    "langgraph>=1.2.15",
    # agentversion (the OSS manifest spec) is an OPTIONAL runtime import for
    # decimalai.export_manifest (absent → the SDK's own surface hash under an
    # honest label), so it stays out of `dependencies`. A test dep so the
    # converter's validate/diff assertions run in the default unit suite
    # (tests/test_export_agentversion.py).
    "agentversion>=0.2.3",
]
# Live-LLM e2e tests (tests/integration/test_framework_live_llm.py). openai 3 world.
# Install with: pip install -e ".[live-llm-tests]"
live-llm-tests = [
    "google-genai>=2.30.1",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "openai>=3.30.0",
    "openai-agents>=0.23.1",
    # Anthropic/Claude provider lane: anthropic drives the native messages tool-use
    # loop (_live_helpers.anthropic_tool_loop); langchain-anthropic backs the
    # ChatAnthropic cells in the generic-framework lanes.
    "anthropic>=1.13.0",
    "langchain-anthropic>=1.7.6",
]
# The live CrewAI OTEL test (tests/integration/test_framework_live_crewai.py):
# CrewAI on Gemini. OPENAI 2 WORLD (crewai pins openai<3), and a world of its own:
# crewai's `google-genai` extra pins google-genai~=1.65.0, which google-adk and
# providers-tests (google-genai>=2.30) rule out, so this extra shares an
# environment with neither. The hermetic CrewAI column needs no Gemini binding and
# lives in conformance-tests-openai2 instead.
# Install with: pip install -e ".[crewai-tests]"
crewai-tests = [
    "crewai[google-genai]>=1.15.27",
    "openinference-instrumentation-crewai>=1.1.21",
    "openinference-instrumentation-google-genai>=1.4.13",
]
# The live Google ADK test (tests/integration/test_framework_live_adk.py). google-adk
# pulls a large transitive runtime (its own server/CLI), so it lives in its own extra.
# Install with: pip install -e ".[adk-tests]"
adk-tests = [
    "google-adk>=2.12.0",
]
# The live LlamaIndex test (tests/integration/test_framework_live_llamaindex.py):
# the native span handler and the OTEL exporter via OpenInference, on three provider
# bindings. OPENAI 2 WORLD: llama-index-llms-openai pins openai<3.
# Install with: pip install -e ".[llamaindex-tests]"
llamaindex-tests = [
    "llama-index-core>=0.14.25",
    "llama-index-llms-openai>=0.8.3",
    "llama-index-llms-anthropic>=0.12.3",
    "llama-index-llms-google-genai>=0.11.2",
    "openinference-instrumentation-llama-index>=4.6.0",
]
# The live Claude Agent SDK test (tests/integration/test_framework_live_claude_agent_sdk.py).
# query() drives the Claude Code engine, so the live test also needs the `claude`
# CLI on PATH (it skips without one) and an ANTHROPIC_API_KEY.
# Install with: pip install -e ".[claude-agent-sdk-tests]"
claude-agent-sdk-tests = [
    "claude-agent-sdk>=0.2.166",
]
# The live direct-provider test (tests/integration/test_framework_live_providers.py):
# the no-framework one-liner, decimalai.init(openai=/anthropic=/google=True). Each
# provider needs BOTH its SDK and the OpenInference instrumentor that
# providers.instrument() enables. openai 3 world.
#
# No caps. anthropic and openinference-instrumentation-anthropic were capped
# (<1.0.0 / <2.0.0) after anthropic 1.0.0 emptied llm_calls under instrumentor
# 1.1.2; anthropic 1.13.0 with instrumentor 3.0.3 passes the whole anthropic
# conformance column (2026-10-14), so both caps went together, as their note asked.
# Install with: pip install -e ".[providers-tests]"
providers-tests = [
    "openai>=3.30.0",
    "anthropic>=1.13.0",
    "google-genai>=2.30.1",
    "openinference-instrumentation-openai>=0.1.65",
    "openinference-instrumentation-anthropic>=3.0.3",
    "openinference-instrumentation-google-genai>=1.4.13",
]
# HERMETIC conformance (tests/conformance, Tier A — stub models + a local probe
# server, no provider key, no backend), openai 3 world: the install set for ci.yml's
# `conformance` job and the backend's release-gate phase P0, kept here so the list
# lives in ONE place. Install with:
#   pip install -e ".[dev,conformance-tests]"
# then run with DECIMAL_TEST_ENV=openai3 DECIMAL_CONFORMANCE_REQUIRE_ALL=1.
#
# It matters that this is COMPLETE. A driver whose imports are missing is recorded
# "NOT RUN", and only REQUIRE_ALL turns that into a failure. Which drivers belong to
# which environment is DRIVER_ENVS in tests/conformance/test_coverage.py; a driver
# added there for openai3 needs its install here.
conformance-tests = [
    # langchain, langgraph, openai, openai-agents, claude-agent-sdk, pydantic-ai,
    # adk, llamaindex.
    "decimalai[all]",
    # The raw-provider rails: the `anthropic` SDK plus the OpenInference
    # instrumentors drivers/anthropic.py and drivers/pydantic_ai.py depend on
    # (init(anthropic=True) / init(openai=True) warn and SKIP without them, which
    # would grade those drivers on a tracing path nothing turned on).
    "decimalai[providers-tests]",
    # The native skill loaders with no DecimalAI adapter (tests/native_loaders, which
    # rides the default `pytest tests/` run). Each adds packages and moves no pin here.
    "deepagents>=0.7.25",
    "agent-framework-core>=1.21.0",
    # Its OpenAI chat client, for the live native check (tests/native/test_native_live.py);
    # 1.16.0 is the newest that accepts agent-framework-core 1.21.
    "agent-framework-openai>=1.16.0",
    "pydantic-ai-harness>=0.57.0",  # 0.57 keeps a user-only skill out of the model's catalog
]
# HERMETIC conformance, openai 2 world: the drivers whose framework cannot be
# installed beside openai>=3, plus the unit tests that need those packages (the
# DECIMAL_TEST_ENV=openai2 subset, tests/conftest.py). Self-sufficient — it carries
# the test toolchain, so it never needs `dev`, whose openai 3 frameworks it cannot
# co-install with. Install with:
#   pip install -e ".[conformance-tests-openai2]"
# then run with DECIMAL_TEST_ENV=openai2 (and DECIMAL_CONFORMANCE_REQUIRE_ALL=1).
conformance-tests-openai2 = [
    "decimalai[test-toolchain]",
    # litellm: the eval runner's unit tests, AND the ADK driver's stub model — it
    # reaches the stub through google.adk.models.lite_llm.LiteLlm, which is why
    # google-adk is graded here rather than in the openai 3 environment.
    "decimalai[evals]",
    # litellm 1.106.x imports mcp on every completion() that carries tools and needs
    # mcp>=2.2 to do it (mcp is only in its own extras), while crewai pins mcp~=1.28.
    # Every tool call then raises ImportError (`CacheableResult` from mcp.types), with
    # no DecimalAI code involved. The ADK driver's stub model sends tools through
    # litellm; the evaluators send none. 1.106.0 was excluded alone, then 1.106.1
    # shipped the same import (CI red on 2026-10-20), so the whole line is capped. Lift
    # the cap once a litellm release completes a tool call beside mcp 1.28.
    "litellm<1.106",
    "decimalai[adk]",
    "decimalai[llamaindex]",
    "llama-index-llms-openai>=0.8.3",
    "openinference-instrumentation-llama-index>=4.6.0",
    # The CrewAI driver reads three instrumentors: CrewAI's own (crew/task/tool
    # spans), OpenAI's (the llm spans — CrewAI 1.15 reaches its model through
    # crewai.llms.providers.openai, and init(crewai=True) activates it), and
    # LiteLLM's (the llm spans when a model string routes through litellm).
    # Without the OpenAI one the CrewAI trace arrives with no llm_calls at all.
    "crewai>=1.15.27",
    "openinference-instrumentation-crewai>=1.1.21",
    "openinference-instrumentation-openai>=0.1.65",
    "openinference-instrumentation-litellm>=0.1.50",
    # The Strands native skill loader (tests/native_loaders). Here, not in the openai 3
    # extra, although it needs no openai: strands-agents caps mcp<2.2, which in the
    # openai 3 environment would move mcp under claude-agent-sdk and openai-agents.
    # Here it only adds packages. Re-check with a resolve diff when either floor moves.
    "strands-agents>=1.61.0",
]

[project.scripts]
decimalai = "decimalai.cli.main:cli"

[project.urls]
# Every link here must resolve for a signed-out stranger — PyPI renders them as
# the project page's links, which is the route someone takes to check that a
# package is real. Verify with a HEAD request before adding one.
Homepage = "https://decimal.ai"
Repository = "https://github.com/decimal-labs/decimalai-python"
Documentation = "https://docs.decimal.ai"
Changelog = "https://docs.decimal.ai/changelog"
Issues = "https://github.com/decimal-labs/decimalai-python/issues"
Releases = "https://github.com/decimal-labs/decimalai-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["decimalai"]

# DO NOT DELETE — this section is the whole reason the sdist is not a repo dump.
# Without it hatchling sweeps in EVERY file git does not ignore. That is not
# hypothetical here: the published 0.10.0 sdist carried `docs/SDK_UPGRADE_v030.md`
# (an internal audit-remediation write-up) and `test-results/.last-run.json`,
# neither of which was ever in the repo — they were simply sitting in the tree when
# `python -m build` ran. An allow-list is the only thing that stops that recurring.
#
# tests/ ships because downstream packagers build from the sdist and run the suite;
# examples/ ships because tests/test_notebook_examples.py walks it and would fail
# without it. The two travel together — dropping examples/ silently breaks the suite
# for anyone who is not building from a git checkout.
[tool.hatch.build.targets.sdist]
include = [
    "/decimalai",
    "/tests",
    "/examples",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
markers = [
    # Framework conformance (tests/conformance) — ONE contract graded against
    # every framework adapter, asserted on real HTTP payloads. Tier A is
    # hermetic (stub model + local probe server, no keys, no backend) and runs
    # in the default suite on every commit; Tier B runs the SAME contract
    # functions against a real provider + real backend. See
    # tests/conformance/README.md.
    "conformance: hermetic framework-conformance suite (Tier A)",
    "conformance_live: framework conformance against a real provider + backend (Tier B)",
    "integration: end-to-end tests against a live backend",
    "live_llm: end-to-end tests that make real LLM API calls (requires RUN_LIVE_LLM_TESTS=1 + provider key)",
    "simple_agent: live_llm sub-marker — 2-tool shopping smoke test",
    "complex: live_llm sub-marker — 5-tool customer support agent",
    "error_recovery: live_llm sub-marker — failing-tool / agent-recovery",
    "multi_agent: live_llm sub-marker — orchestrator → specialist handoff",
    "streaming: live_llm sub-marker — streamed agent events",
    "parallel_tools: live_llm sub-marker — multiple tool calls in a single LLM step",
    "manifest_drift: live_llm sub-marker — prompt change triggers new manifest + regression-check",
    "otel: live_llm sub-marker — OpenTelemetry SpanExporter ingest path (CrewAI/Haystack/etc.)",
    "crewai: live_llm sub-marker — real CrewAI Crew on Gemini through the OTEL exporter",
    "adk: live_llm sub-marker — real Google ADK agent on Gemini through the native plugin",
    "llamaindex: live_llm sub-marker — real LlamaIndex RAG query engine through the native span handler + the OTEL exporter",
    "claude_agent_sdk: live_llm sub-marker — real Claude Agent SDK query() run through the native stream tracer",
    "providers: live_llm sub-marker — direct/no-framework provider-SDK calls (raw openai/anthropic/google.genai) through the one-liner instrumentor",
    "skill_routing: live_llm sub-marker — real model picks the right skill from the SkillRouter menu, and the offered→activated routing join closes",
    "heavy: live_llm sub-marker — deep/large stress traces (long dependent loops, wide big-payload fan-out, 3-level nested tree, kitchen-sink combined shape). Runs in the release gate BY DEFAULT (opt out with --skip-heavy); excluded from the routine live sweep via `-m 'live_llm and not heavy'`; alone via `-m heavy`.",
]
# Don't pick up integration or live-LLM tests in the default test run — they
# need a live backend and (for live_llm) a provider API key. `conformance_live`
# is Tier B of the conformance suite and needs both, so it is excluded for the
# same reason; Tier A (`conformance`) is hermetic and DOES run by default.
addopts = "-m 'not integration and not live_llm and not conformance_live and not conformance'"
# `conformance` is deselected from the DEFAULT run and owned by its own CI job —
# not because it is optional, but because it deliberately does not reset adapter
# module globals between phases (running two agents back to back is where sticky
# process-global state bites, and that is a defect it exists to catch). Those
# globals then leak into the unit suite: running it inline turns 11 pre-existing
# failures into 18. It is NOT the "exists but never runs" trap that let the
# LlamaIndex adapter ship emitting nothing — ci.yml runs it as two required jobs on
# every push and PR (one per test environment), and `make ci-workflows` picks them
# up automatically. Run it locally with:
#   DECIMAL_TEST_ENV=openai3 pytest tests/conformance -m conformance   (and openai2)
# Only collect the real suite. examples/ holds runnable demo scripts — e.g.
# examples/test_examples.py uses a def test(name, fn) mini-runner — that a bare
# `pytest` from the repo root would otherwise mis-collect and error on.
testpaths = ["tests"]
