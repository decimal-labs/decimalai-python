[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decimalai"
version = "0.10.3"
description = "Open source SDK for manifest-aware agent change management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Decimal AI"}]
keywords = [
    "ai-agents",
    "llm",
    "agent-versioning",
    "regression-testing",
    "tracing",
    "observability",
    "evaluation",
    "skills",
    "manifest",
    "langchain",
    "openai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.28.1",
    # 8.2 is the floor a bare `decimalai` invocation actually needs: before it,
    # a no-args group exits 0 instead of 2, so the start hint never fires.
    # Bisected 2026-08-17 — 8.0/8.1 fail, 8.2/8.3 pass.
    "click>=8.2",
    # Floored at 1.28.0 — the lowest opentelemetry at which the OpenInference
    # instrumentor stack (the spans this SDK exists to route) actually *works*,
    # not just co-installs. Below it the floor lane installs but fails at import:
    # semconv < 0.46b0 lacks `opentelemetry.semconv.attributes` (the instrumentors'
    # BaseInstrumentor imports it), and opentelemetry-instrumentation < 0.49b0
    # imports `pkg_resources` (absent from modern/uv venvs). 1.28.0 pairs with
    # semconv 0.49b0 + instrumentation 0.49b0 — first version both are satisfied.
    # (Was >=1.20, a co-installs-but-import-breaks fiction.) Verify by installing
    # the lowest version every floor allows and importing the instrumentors.
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-api>=1.28.0",
    # Floor rationale: the SDK code imports only skillevaluation.parser (stable since
    # 0.1.0) and the runner CLI (0.2.0). Floored at 0.4.0 for `skillevaluation.safety`,
    # which `decimalai skills scan` imports. Verify by installing at the floor
    # and importing.
    "skillevaluation>=0.4.0",
]

[project.optional-dependencies]
# Framework/provider adapters are extras, not core deps (since 2026-07-23).
# Every framework import in the package is function-local and guarded with an
# ImportError naming its extra, so a core-only install stays importable.
# langchain-core floored at 1.3.3, and the number is the CVE fix, not the
# co-install minimum. The adapter itself works far lower — conformance grades
# identically from 0.3.67 through 1.5.5 — so what sets this floor is
# CVE-2026-44843 (High; unsafe deserialization through an over-broad load()
# allowlist), which affects 1.0.0–1.3.2 and is fixed in 1.3.3 / 0.3.85. The
# previous comment claimed ">=1.3.0 is CVE-clean"; it was not, by three patch
# releases. CVE-2026-40087 (Moderate) is fixed earlier, in 1.2.28 / 0.3.84.
# 0.3.x is deliberately out of support even though it works: it cannot pair
# with a current langgraph, which requires langchain-core>=1.4.7.
#
# The floor is HIGHER on Python 3.10, and the reason is per-run skill attribution,
# not a CVE. langchain-core routes async runnable bodies through
# runnables/utils.py::coro_with_context, which before 1.4.8 could only carry its
# config ContextVar into a task via asyncio.create_task(..., context=) — an
# argument that does not exist below Python 3.11. On 3.10 it therefore fell back
# to a plain create_task and dropped the context, so _ambient_run_scope() (see
# decimalai/langchain.py) reads no parent_run_id and the Router files every
# load_skill() unscoped. Concurrent runs then cross-contaminate: measured on
# 1.3.3/py3.10, one run's activation is lost and another reports one it never
# made. 1.4.8 replaced that branch with context.run(asyncio.create_task, coro),
# which works on every version. Bisected: 1.3.0–1.4.7 fail on py3.10, 1.4.8+
# pass, and py3.11+ passes throughout. So >=1.3.3 is a true claim on 3.11+ and
# was a false one on 3.10 — this marker states each where it holds.
langchain = [
    "langchain-core>=1.3.3,<2; python_version >= '3.11'",  # Cap the major. Redundant while langgraph pins <2 itself, but bites for langchain-without-langgraph installs. Review the cap when 2.0 is announced — do not let it outlive its reason the way openai<3 did.
    "langchain-core>=1.4.8,<2; python_version < '3.11'",   # See above: per-run scope needs context.run(create_task) — 3.10 has no create_task(context=).
]
# 2.26.0 is the effective floor (lowest that co-resolves with the modern
# set). Resolve-verified; live-verify pending an OpenAI run (key quota-blocked).
# The `openai` SDK is never imported by decimalai code — this extra exists so
# `pip install "decimalai[openai]"` co-installs the provider SDK the
# init(openai=True) one-liner instruments.
openai = [
    # NO major cap, deliberately. The old `<3` was defensive boilerplate and it
    # did real damage: openai-agents 0.21.0 requires openai>=3.0.0,<4, so with
    # the cap in place `pip install "decimalai[all]"` resolved openai-agents
    # back to 0.20.0 — users were held a minor behind by OUR pin, not upstream's.
    # Verified with `uv pip compile` before and after. openai 3.1.0 passes
    # conformance at baseline. The conformance job is the control here, not a
    # version range: a cap only ever guesses at breakage, and this one guessed
    # wrong for six weeks. If a future major does break us, the job says so.
    "openai>=2.26.0",
]
# 0.18.1, not 0.17.2. The old floor was a CONDITIONAL fiction — the same shape
# as the llamaindex >=0.10.20 floor: 0.17.2 genuinely works, but only against an
# `openai` version this package's own extra would not select, so the pair could
# resolve into a window where the adapter is broken. Floors on two packages in
# two different extras can falsify each other; only a resolve-then-run check
# catches it, which is what conformance now does.
openai-agents = ["openai-agents>=0.18.1"]
# Runtime extra for the native Claude Agent SDK integration
# (decimalai.init(claude_agent_sdk=True)). Floor mirrors claude-agent-sdk-tests;
# NOT yet verified at the floor — refine by installing at the floor and importing.
claude-agent-sdk = ["claude-agent-sdk>=0.1.0"]
# Runtime extra for the Pydantic AI skill loader (decimalai.pydantic_ai.install).
# Floor is conservative and NOT yet verified at the floor (the adapter only needs
# Agent.__init__ + @agent.system_prompt, both stable since early releases) —
# refine by installing at the floor and importing.
pydantic-ai = ["pydantic-ai>=0.1.0"]
# Runtime extra for the native Google ADK plugin (decimalai.init(adk=True)).
# Floor mirrors adk-tests (the version the adapter was built+verified against).
adk = ["google-adk>=2.0.0"]
langgraph = ["langgraph>=0.6.0"]
# Runtime extra for the native LlamaIndex integration (decimalai.init(llamaindex=True)).
# Floored at 0.12.0 — VERIFIED at the floor: a MockLLM query engine through the
# real dispatcher exports a trace. The old 0.10.20 floor was fiction twice over:
# llama_index.core.instrumentation does not exist there, and where it does exist
# pre-0.10.30 the dispatcher calls handlers as span_enter(instance, id=...),
# which raises TypeError inside decimalai/llamaindex.py and — unlike 0.12's
# guarded dispatch — takes the user's query down with it (verified on 0.10.24).
# Same floor the adapter's own ImportError message and [llamaindex-tests] state.
llamaindex = ["llama-index-core>=0.12.0"]
evals = ["litellm>=1.30"]
# Everything above in one install. Self-referential extra — floors stay
# defined once in their own extras.
all = [
    "decimalai[langchain,openai,openai-agents,claude-agent-sdk,pydantic-ai,adk,langgraph,llamaindex,evals]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
    "responses>=0.23",
    # Mirror the [langchain] extra exactly. This previously floored at 1.3.0 and
    # called it "CVE-clean" — it was not: CVE-2026-44843 affects 1.0.0–1.3.2, so
    # the floors job had been resolving a vulnerable langchain-core. pip-audit
    # did not catch it because the audit job installs `.`, not `.[dev]`.
    "langchain-core>=1.3.3; python_version >= '3.11'",
    "langchain-core>=1.4.8; python_version < '3.11'",
    # openai-agents moved out of core deps into an extra; keep it in dev so the
    # default unit suite still exercises the openai_agents adapter.
    "openai-agents>=0.17.2",
    # langgraph — needed for the create_react_agent introspection test. Lightweight
    # enough to include in `dev` (langgraph itself is small; the heavy bit
    # is the compiled-graph tooling, not network).
    # Floored at 0.6.0 — the lowest langgraph that ships `langgraph._internal`,
    # which the modern langgraph-prebuilt imports (0.5.x and below break).
    "langgraph>=0.6.0",
    # agentversion (the OSS manifest spec) is an OPTIONAL runtime import for
    # decimalai.export_manifest: present → canonical jcs-sha256 hash + a manifest
    # that validates with zero warnings; absent → the SDK's own surface hash
    # under an honest algorithm label (export_manifest never hard-requires it,
    # so it stays out of the main `dependencies`). It's a *test* dep here so the
    # converter's validate/diff assertions run in the default unit suite
    # (tests/test_export_agentversion.py). Floored at >=0.2.0: the SDK now uses
    # 0.2.0-only modules — agentversion.contract.contract_from_components (the
    # shared contract assembler) and agentversion.a2a.manifest_to_agent_card
    # (ManifestSnapshot.to_a2a_card) — so a 0.1.0 resolve fails test collection.
    # >=0.2.1 specifically: the new behavioral_policy/environment contract
    # surfaces + the tool_calling_mode/runtime_version lift land in 0.2.1's
    # contract_from_components, which the conformance test compares against.
    # NOTE: the release-gate constraints file still pins ==0.1.0 — regenerate it
    # and re-verify at the floor before shipping.
    "agentversion>=0.2.1",
]
# Optional extras needed only for live-LLM e2e tests (tests/integration/test_framework_live_llm.py).
# Install with: pip install -e ".[live-llm-tests]"
live-llm-tests = [
    "google-genai>=1.65.0",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=0.3.34",
    "langgraph>=0.6.0",
    "openai>=2.26.0",
    "openai-agents>=0.17.2",
    # Anthropic/Claude provider lane: anthropic drives the native messages
    # tool-use loop (_live_helpers.anthropic_tool_loop); langchain-anthropic
    # backs the ChatAnthropic cells in the generic-framework lanes. Floors are
    # resolve-verified at the floor: 0.3.0
    # can't co-install with langchain-core 1.3.0 (lowest co-installable is 0.3.21),
    # and langchain-anthropic 0.3.21 in turn requires anthropic>=0.69.0 — so the
    # old >=0.40.0 / >=0.3.0 pair was an unreachable fiction. Live-verify still
    # pending an ANTHROPIC_API_KEY run, but the install floors are now real.
    "anthropic>=0.69.0",
    "langchain-anthropic>=0.3.21",
]
# Optional extras for the live CrewAI OTEL test (tests/integration/test_framework_live_crewai.py).
# CrewAI + its OpenInference bridges are heavy (~80 transitive pkgs) and pin a
# native google-genai provider, so they live in their own extra rather than
# bloating live-llm-tests. Install with: pip install -e ".[crewai-tests]"
crewai-tests = [
    "crewai[google-genai]>=1.14.6",
    "openinference-instrumentation-crewai>=1.1.8",
    "openinference-instrumentation-google-genai>=1.0.2",
]
# Optional extras for the live Google ADK test (tests/integration/test_framework_live_adk.py).
# google-adk pulls a large transitive runtime (its own server/CLI), so it lives in
# its own extra rather than bloating live-llm-tests. Floor is the version the
# native-plugin adapter was built+verified against; refine by installing at the floor.
# Install with: pip install -e ".[adk-tests]"
adk-tests = [
    "google-adk>=2.0.0",
]
# Optional extras for the live LlamaIndex test (tests/integration/test_framework_live_llamaindex.py).
# Covers BOTH adapter paths: the native span handler (decimalai.llamaindex.install) and the OTEL
# exporter via OpenInference. Pulls llama-index-core + the three provider LLM bindings + the
# OpenInference LlamaIndex instrumentor. The native runtime extra (`llamaindex`) floors core at
# 0.10.20 (where the SpanHandler API landed); this *test* extra floors higher because the current
# google_genai binding + the OpenInference instrumentor need a modern core. Floors are conservative
# and NOT yet verified at the floor (no llama-index install at authoring) — refine by
# installing at the floor. Install with: pip install -e ".[llamaindex-tests]"
llamaindex-tests = [
    "llama-index-core>=0.12.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-llms-anthropic>=0.6.0",
    "llama-index-llms-google-genai>=0.1.0",
    "openinference-instrumentation-llama-index>=3.0.0",
]
# Optional extras for the live Claude Agent SDK test
# (tests/integration/test_framework_live_claude_agent_sdk.py). The Claude Agent SDK
# is Anthropic's agent framework; its query() drives the Claude Code engine, so the
# live test also needs the `claude` CLI on PATH (the test skips when it's absent) and
# an ANTHROPIC_API_KEY. anthropic-only lane (FRAMEWORK_PROVIDERS). Floor is conservative
# and NOT yet verified at the floor (no claude-agent-sdk install at authoring) — refine
# by installing at the floor. Install with: pip install -e ".[claude-agent-sdk-tests]"
claude-agent-sdk-tests = [
    "claude-agent-sdk>=0.1.0",
]
# Optional extras for the live direct-provider test
# (tests/integration/test_framework_live_providers.py). Covers the no-framework
# one-liner: decimalai.init(openai=/anthropic=/google=True) / providers.instrument().
# Each provider needs BOTH its SDK and its OpenInference instrumentor (the latter
# is what providers.instrument() enables). All six floors are verified at the
# floor: the lowest-direct resolution lands exactly these
# versions, they co-install, and all three instrumentors import against their
# floor SDK (needs the core opentelemetry>=1.28.0 floor — see the dependencies
# block). anthropic stays at 0.40.0 here (not live-llm-tests' 0.69.0): this extra
# has no langchain-anthropic to force it up, and the anthropic instrumentor imports
# fine against SDK 0.40.0. Install with: pip install -e ".[providers-tests]"
providers-tests = [
    "openai>=2.26.0",
    "anthropic>=0.40.0",
    "google-genai>=1.65.0",
    "openinference-instrumentation-openai>=0.1.18",
    "openinference-instrumentation-anthropic>=0.1.14",
    "openinference-instrumentation-google-genai>=1.0.2",
]
# Every framework the HERMETIC conformance tier drives (tests/conformance, Tier A —
# stub models + a local probe server, no provider key, no backend). This is the
# install set for the `conformance` CI job and for the backend's release-gate
# phase; it exists so that list lives in ONE place with floors, instead of being
# retyped in a workflow file.
#
# It matters that this is COMPLETE. A driver whose imports are missing is recorded
# "NOT RUN" and the job still goes green — which is the exact shape of the failure
# this suite exists to remove (a green suite that proved nothing). Install with:
#   pip install -e ".[dev,conformance-tests]"
#
# Versions are resolve-verified together on 2026-08-15 (crewai 1.6.1, google-adk
# 2.7.0, llama-index-core 0.14.23, claude-agent-sdk 0.2.139, pydantic-ai 2.31.0,
# openai 2.54.0, langchain-core 1.5.5): all nine drivers import and run in one
# venv. The floors below are NOT floor-verified — refine by installing at the
# floor and running the tier.
conformance-tests = [
    # Every runtime framework extra in one line: langchain, langgraph, openai,
    # openai-agents, claude-agent-sdk, pydantic-ai, adk, llamaindex, evals
    # (litellm). The `-tests` extras beside them are deliberately NOT reused here
    # — see the CrewAI note below; they install live-lane provider bindings this
    # tier has no use for, and one of them makes the set unsatisfiable.
    "decimalai[all]",
    # The raw-provider rails: the `anthropic` SDK plus the OpenInference
    # instrumentors that drivers/anthropic.py and drivers/pydantic_ai.py depend
    # on (init(anthropic=True) / init(openai=True) warn and SKIP without them,
    # which would grade those drivers on a tracing path nothing turned on).
    "decimalai[providers-tests]",
    # CrewAI. Deliberately NOT the `crewai-tests` extra: that one installs
    # crewai[google-genai], which pins google-genai<1.65.0 and is flatly
    # UNSATISFIABLE alongside google-adk>=2.0.0 (which needs >=1.66) — verified
    # with `uv pip compile --universal`. This tier's CrewAI driver reaches its
    # model through the OPENAI SDK against a local stub (see the instrumentor
    # note below), so the google-genai provider binding is a live-lane need it
    # does not have. The floor is lower than
    # crewai-tests' 1.14.6 for the same reason the live lane's is higher: 1.6.1
    # is what co-resolves with google-adk + litellm here, and it is what the
    # tier was verified on.
    "crewai>=1.6.1",
    "openinference-instrumentation-crewai>=1.1.8",
    # No AutoGen line, deliberately. Both lineages were retired as integrations
    # (2026-08-16): `init(autogen=True)` is now an alias for the generic OTel
    # exporter that warns, and drivers/generic_otel.py already grades that rail.
    # drivers/crewai.py reads THREE instrumentors, because which one carries the
    # LLM detail depends on the CrewAI version and the model string:
    #   * CrewAI's own — the crew/task/tool spans, always;
    #   * LiteLLM's    — the llm spans up to CrewAI 1.14, when an `openai/…`
    #                    model went through litellm;
    #   * OpenAI's     — the llm spans from CrewAI 1.15, where `LLM.__new__`
    #                    returns crewai.llms.providers.openai.completion.
    #                    OpenAICompletion and litellm is never imported (checked
    #                    on 1.15.16: `crewai.llm._litellm_loaded is False`).
    # The openai one arrives via decimalai[providers-tests] above and is activated
    # automatically by init(crewai=True), so there is no line for it here — but
    # on 1.15 it is the load-bearing one, and without it the CrewAI trace arrives
    # with no llm_calls at all. The crewai-tests extra carries neither.
    "openinference-instrumentation-litellm>=0.1.30",
]

[project.scripts]
decimalai = "decimalai.cli.main:cli"

[project.urls]
# Every link here must resolve for a signed-out stranger — PyPI renders them as
# the project page's links, which is the route someone takes to check that a
# package is real. Verify with a HEAD request before adding one.
Homepage = "https://decimal.ai"
Repository = "https://github.com/decimal-labs/decimalai-python"
Documentation = "https://docs.decimal.ai"
Changelog = "https://docs.decimal.ai/changelog"
Issues = "https://github.com/decimal-labs/decimalai-python/issues"
Releases = "https://github.com/decimal-labs/decimalai-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["decimalai"]

# DO NOT DELETE — this section is the whole reason the sdist is not a repo dump.
# Without it hatchling sweeps in EVERY file git does not ignore. That is not
# hypothetical here: the published 0.10.0 sdist carried `docs/SDK_UPGRADE_v030.md`
# (an internal audit-remediation write-up) and `test-results/.last-run.json`,
# neither of which was ever in the repo — they were simply sitting in the tree when
# `python -m build` ran. An allow-list is the only thing that stops that recurring.
#
# tests/ ships because downstream packagers build from the sdist and run the suite;
# examples/ ships because tests/test_notebook_examples.py walks it and would fail
# without it. The two travel together — dropping examples/ silently breaks the suite
# for anyone who is not building from a git checkout.
[tool.hatch.build.targets.sdist]
include = [
    "/decimalai",
    "/tests",
    "/examples",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
markers = [
    # Framework conformance (tests/conformance) — ONE contract graded against
    # every framework adapter, asserted on real HTTP payloads. Tier A is
    # hermetic (stub model + local probe server, no keys, no backend) and runs
    # in the default suite on every commit; Tier B runs the SAME contract
    # functions against a real provider + real backend. See
    # tests/conformance/README.md.
    "conformance: hermetic framework-conformance suite (Tier A)",
    "conformance_live: framework conformance against a real provider + backend (Tier B)",
    "integration: end-to-end tests against a live backend",
    "live_llm: end-to-end tests that make real LLM API calls (requires RUN_LIVE_LLM_TESTS=1 + provider key)",
    "simple_agent: live_llm sub-marker — 2-tool shopping smoke test",
    "complex: live_llm sub-marker — 5-tool customer support agent",
    "error_recovery: live_llm sub-marker — failing-tool / agent-recovery",
    "multi_agent: live_llm sub-marker — orchestrator → specialist handoff",
    "streaming: live_llm sub-marker — streamed agent events",
    "parallel_tools: live_llm sub-marker — multiple tool calls in a single LLM step",
    "manifest_drift: live_llm sub-marker — prompt change triggers new manifest + regression-check",
    "otel: live_llm sub-marker — OpenTelemetry SpanExporter ingest path (CrewAI/Haystack/etc.)",
    "crewai: live_llm sub-marker — real CrewAI Crew on Gemini through the OTEL exporter",
    "adk: live_llm sub-marker — real Google ADK agent on Gemini through the native plugin",
    "llamaindex: live_llm sub-marker — real LlamaIndex RAG query engine through the native span handler + the OTEL exporter",
    "claude_agent_sdk: live_llm sub-marker — real Claude Agent SDK query() run through the native stream tracer",
    "providers: live_llm sub-marker — direct/no-framework provider-SDK calls (raw openai/anthropic/google.genai) through the one-liner instrumentor",
    "skill_routing: live_llm sub-marker — real model picks the right skill from the SkillRouter menu, and the offered→activated routing join closes",
    "heavy: live_llm sub-marker — deep/large stress traces (long dependent loops, wide big-payload fan-out, 3-level nested tree, kitchen-sink combined shape). Runs in the release gate BY DEFAULT (opt out with --skip-heavy); excluded from the routine live sweep via `-m 'live_llm and not heavy'`; alone via `-m heavy`.",
]
# Don't pick up integration or live-LLM tests in the default test run — they
# need a live backend and (for live_llm) a provider API key. `conformance_live`
# is Tier B of the conformance suite and needs both, so it is excluded for the
# same reason; Tier A (`conformance`) is hermetic and DOES run by default.
addopts = "-m 'not integration and not live_llm and not conformance_live and not conformance'"
# `conformance` is deselected from the DEFAULT run and owned by its own CI job —
# not because it is optional, but because it deliberately does not reset adapter
# module globals between phases (running two agents back to back is where sticky
# process-global state bites, and that is a defect it exists to catch). Those
# globals then leak into the unit suite: running it inline turns 11 pre-existing
# failures into 18. It is NOT the "exists but never runs" trap that let the
# LlamaIndex adapter ship emitting nothing — ci.yml runs it as a required job on
# every push and PR, and `make ci-workflows` picks that job up automatically.
# Run it locally with: pytest tests/conformance
# Only collect the real suite. examples/ holds runnable demo scripts — e.g.
# examples/test_examples.py uses a def test(name, fn) mini-runner — that a bare
# `pytest` from the repo root would otherwise mis-collect and error on.
testpaths = ["tests"]
